<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- fixed-scale viewport for a web-app feel: no pinch/double-tap zoom on
         mobile (iOS still allows its accessibility pinch, by design) -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Unfolded" />
    <meta name="theme-color" content="#ffffff" />
    <title>Unfolded — Slab Pottery Templates</title>
    <meta
      name="description"
      content="Design slab-built pottery in 3D and print true-scale templates, shrinkage-compensated for your clay. WebMCP-native: edit the same design by chatting with an agent."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Unfolded — Slab Pottery Templates" />
    <meta
      property="og:description"
      content="Design in 3D, print flat, build in clay. A WebMCP-native template designer for slab pottery."
    />
    <meta property="og:url" content="https://unfolded.carciofomobile.workers.dev/" />
    <meta property="og:image" content="https://unfolded.carciofomobile.workers.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      /* boot loader: lives inside #root, so React's first render replaces it */
      .boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #ffffff;
      }
      .boot svg {
        width: 54px;
        animation: boot-pulse 1.5s ease-in-out infinite;
      }
      .boot span {
        font: 600 15px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
        letter-spacing: -0.02em;
        color: #111827;
        animation: boot-pulse 1.5s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        0%, 100% { opacity: 0.35; transform: scale(0.97); }
        50%      { opacity: 1; transform: scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot svg, .boot span { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" aria-label="Loading Unfolded">
        <svg viewBox="40 48 226 186" aria-hidden="true">
          <path fill="#0A5BFF" d="M46 58Q46 53 51 56l65 36q4 2 4 8v80q0 6-5 3l-65-36q-4-2-4-7V58Z"/>
          <path fill="#111827" d="m128 94 65-36q5-3 5 3v79q0 5-4 7l-66 36q-5 3-5-3v-79q0-5 5-7Z"/>
          <path fill="#0646CC" d="m128 188 65-36q4-2 8 0l58 32q6 3 0 7l-65 36q-4 2-8 0l-58-32q-6-3 0-7Z"/>
        </svg>
        <span>unfolded</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
