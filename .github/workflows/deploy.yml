name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Install Chromium for e2e
        run: npx playwright install --with-deps chromium
      - name: End-to-end (WebMCP tools, share links, export)
        run: npm run e2e
      - name: Worker smoke (Durable Objects, pairing protocol) — hard gate
        run: npm run e2e:worker
      # Non-blocking until it earns a green streak (hardening spec 6.3):
      # the pairing suite drives two real browsers against wrangler dev and
      # is the flakiest path — a red here is loud but must never block an
      # emergency deploy near the deadline.
      - name: Cross-device pairing e2e (non-blocking)
        run: npm run e2e:pairing
        continue-on-error: true
      # The agentless bench of the tool surface, kept as an artifact per run
      # and compared against the previous green run (non-blocking for one
      # release, per docs/webmcp-profiler-0.2-spec.md §18.8).
      - name: Bench the WebMCP tool surface (non-blocking)
        run: npm run perf -- --json bench.json
        continue-on-error: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: bench-${{ github.sha }}
          path: bench.json
          if-no-files-found: ignore
      - name: Deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      # What is live is what gets tested: the same sweep a contributor runs
      # with `npm run live`, against production, once the deploy is out.
      # Non-blocking for one release (a failure here is loud, not a rollback).
      - name: Post-deploy smoke of production (non-blocking)
        run: node e2e/live.mjs https://tryunfolded.com
        continue-on-error: true
